[project]
name = "wechat-chatbot"
version = "0.1.0"
description = "A readable, debuggable DeepSeek chatbot with a future WeChat adapter."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<1",
    "python-dotenv>=1.1,<2",
]

[project.scripts]
wechat-chatbot = "wechat_chatbot.app:main"

[dependency-groups]
dev = [
    "debugpy>=1.8,<2",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
